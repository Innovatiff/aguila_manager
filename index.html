<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%234f46e5'/%3E%3Cg transform='translate(2.8 8.03) scale(0.726)'%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z'/%3E%3C/g%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Águila — Gerencia</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>
<body>

<!-- ══════════ Acceso ══════════ -->
<div class="login" id="login">
  <div class="login-inner">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="7 0 44 44"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg>
      </div>
      <div class="login-name">Águila</div>
      <div class="login-sub">Gerencia</div>
    </div>

    <div class="login-card">
      <h2>Inicia sesión</h2>
      <p>Con tu cuenta de gerencia de siempre.</p>

      <div class="alert err" id="loginAlert" style="display:none"><ion-icon name="alert-circle-outline"></ion-icon><span id="loginAlertMsg"></span></div>

      <form onsubmit="doLogin(event)">
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="mail" placeholder="tu@correo.com" required autocomplete="email" inputmode="email">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="pass" placeholder="Tu contraseña" required autocomplete="current-password">
            <button type="button" class="pw-eye" onclick="togglePw()"><ion-icon name="eye-outline" id="pwIco"></ion-icon></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top:6px">
          <ion-icon name="log-in-outline"></ion-icon> Entrar
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ══════════ App ══════════ -->
<div class="app" id="app">
  <header class="appbar">
    <div style="flex:1">
      <h1 id="barTitle">Panel</h1>
      <span class="sub" id="barSub"></span>
    </div>
    <div id="barAva" onclick="showPerfil()" style="cursor:pointer"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- Conversación a pantalla completa -->
<div class="thread" id="thread">
  <div class="thread-bar">
    <button class="back" onclick="closeThread()"><ion-icon name="chevron-back-outline"></ion-icon></button>
    <div id="threadAva"></div>
    <div style="flex:1;min-width:0">
      <div class="thread-n" id="threadN"></div>
      <div class="thread-s" id="threadS"></div>
    </div>
    <button class="back" id="grpEditBtn" style="display:none" onclick="abrirGrupo(activeChat.id)"
            aria-label="Editar grupo"><ion-icon name="settings-outline"></ion-icon></button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div id="composeWrap"></div>
</div>

<!-- Hoja inferior -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="app.js"></script>
<script>
// ══════════ Acceso ══════════
function togglePw() {
  const i = document.getElementById('pass'), c = document.getElementById('pwIco');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  c.setAttribute('name', show ? 'eye-off-outline' : 'eye-outline');
}
function loginErr(msg) {
  document.getElementById('loginAlertMsg').textContent = msg;
  document.getElementById('loginAlert').style.display = '';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon> Entrando...';
  document.getElementById('loginAlert').style.display = 'none';
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('mail').value.trim(),
      document.getElementById('pass').value);
  } catch (err) {
    loginErr(err.code === 'auth/invalid-login-credentials' || err.code === 'auth/wrong-password'
      ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar: ' + err.message);
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="log-in-outline"></ion-icon> Entrar';
  }
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    document.getElementById('app').classList.remove('on');
    document.getElementById('login').style.display = '';
    return;
  }
  try {
    await loadSession(user);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('on');
    document.getElementById('barAva').innerHTML = avatar(ME.name, 36);
    buildTabs();
    watchChats();
    setupPush();
    go('inicio');
  } catch (err) {
    await auth.signOut();
    loginErr(err.message);
    const btn = document.getElementById('loginBtn');
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="log-in-outline"></ion-icon> Entrar';
  }
});

function showPerfil() {
  openSheet(`
    <h3>${esc(ME.name)}</h3>
    <p class="lead">${esc(ME.email || '')} · Gerencia</p>
    <div class="field"><label>Mi nombre — como se ve en el chat y en todo el sistema</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="miNombre" value="${esc(ME.name)}" style="flex:1">
        <button class="btn btn-primary" id="nomBtn" onclick="guardarMiNombre()">Guardar</button>
      </div></div>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><div class="row-main"><div class="row-t">Escritorio</div>
        <div class="row-s">Nómina, horario y reportes viven en el software completo.</div></div></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="auth.signOut();closeSheet()">
      <ion-icon name="log-out-outline"></ion-icon> Cerrar sesión
    </button>`);
}

// El nombre inicial sale del correo; aquí se pone el nombre real.
async function guardarMiNombre() {
  const nombre = document.getElementById('miNombre').value.trim();
  if (!nombre) { toast('El nombre no puede quedar vacío.', 'err'); return; }
  const btn = document.getElementById('nomBtn');
  btn.disabled = true;
  try {
    await db.collection('Main').doc(ME.uid).update({ name: nombre });
    await db.collection('UserIndex').doc(ME.uid).set({ name: nombre }, { merge:true });
    ME.name = nombre;
    document.getElementById('barAva').innerHTML = avatar(ME.name, 36);
    closeSheet();
    toast('Nombre actualizado: ' + nombre, 'ok');
  } catch (err) { btn.disabled = false; toast('No se pudo cambiar: ' + err.message, 'err'); }
}

// ══════════ Navegación ══════════
const TABS = [
  { id:'inicio',   ico:'speedometer-outline', lbl:'Panel'    },
  { id:'grupo',    ico:'chatbubbles-outline', lbl:'Grupo'    },
  { id:'viajes',   ico:'car-outline',         lbl:'Viajes'   },
  { id:'pedidos',  ico:'clipboard-outline',   lbl:'Pedidos'  },
  { id:'permisos', ico:'calendar-outline',    lbl:'Permisos' }
];
let TAB = 'inicio';

function buildTabs() {
  document.getElementById('tabbar').innerHTML = TABS.map(t =>
    `<button class="tab ${t.id===TAB?'on':''}" data-t="${t.id}" onclick="go('${t.id}')">
       <ion-icon name="${t.ico}"></ion-icon><span>${t.lbl}</span></button>`).join('');
}

const TITLES = { inicio:'Panel', grupo:'Grupo', viajes:'Viajes', pedidos:'Pedidos', permisos:'Permisos' };

function go(tab) {
  TAB = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  document.getElementById('barTitle').textContent = TITLES[tab] || '';
  document.getElementById('barSub').textContent = tab === 'inicio'
    ? fDateLong(new Date()) : storeName(tiendaActiva());
  stopChatListeners();
  ({ inicio:vInicio, grupo:vGrupo, viajes:vViajes, pedidos:vPedidos,
     permisos:vPermisos }[tab] || vInicio)();
}

const el = () => document.getElementById('view');
const loading = (n=3) => el().innerHTML = '<div class="skel-card"></div>'.repeat(n);

function errView(err) {
  console.error(err);
  el().innerHTML = `<div class="card"><div class="empty">
    <ion-icon name="alert-circle-outline"></ion-icon><p>${esc(err.message)}</p></div></div>`;
}

// Fichas de tienda: el mismo par en todas las vistas que filtran
function chipsTienda(onchange) {
  const cur = tiendaActiva();
  return `<div class="chips-tienda">
    ${STORE_IDS.map(id => `
      <button class="chip-t ${cur===id?'on':''}" style="--sc:${STORES[id].color}"
        onclick="setTienda('${id}');${onchange}">${storeShort(id)}</button>`).join('')}
  </div>`;
}

// ══════════ Panel ══════════
async function vInicio() {
  loading(3);
  try {
    const store = tiendaActiva();
    const hoy = todayStr();
    const [emps, jobs, abiertos, deHoy, tos, regs, tareas, hechosDia, reps, mdia] = await Promise.all([
      getEmployees(), getJobs(), getOpenClockIns(), getClockInsHoy(),
      getTimeOff(), getRegistros({ store, desde: hoy, hasta: hoy }),
      getTareas(store), getHechosDe(hoy, store), getReportes(),
      getMensajeDia().catch(() => ({ texto: '' }))
    ]);
    tareasHoy = tareas.filter(tareaAplicaHoy);
    mensajeDia = mdia;
    hechosHoy = hechosDia;
    reportes  = reps;
    empsCache = emps;

    const misEmps    = emps.filter(e => e.store === store && e.status === 'active');
    const trabajando = abiertos.filter(c => c.store === store);
    const horasHoy   = deHoy.filter(c => c.store === store && c.clockOut)
                            .reduce((s,c) => s + (c.hours||0), 0);
    const pendientes = tos.filter(t => t.status === 'pending');
    const enRuta     = regs.filter(r => r.status === 'en-ruta');

    const filas = trabajando.length ? trabajando.map(c => {
      const emp = emps.find(e => e.id === c.employeeId);
      if (!emp) return '';
      const job = jobs.find(j => j.id === emp.jobId);
      const ci  = c.clockIn && c.clockIn.toDate ? c.clockIn.toDate() : new Date();
      const olvido = c.date && c.date < hoy;
      return `<div class="row">
        ${avatar(emp.name, 38)}
        <div class="row-main">
          <div class="row-t">${esc(emp.name)}</div>
          <div class="row-s">${esc(job ? job.title : '—')} · desde las ${fTime(ci)}</div>
        </div>
        ${olvido
          ? `<span class="badge b-amber">Sin cerrar ${fDateShort(c.date)}</span>`
          : `<span class="badge b-green">${numES((Date.now()-ci.getTime())/3600000, 1)} h</span>`}
      </div>`;
    }).join('') : `<div class="empty"><ion-icon name="time-outline"></ion-icon>
      <p>Nadie tiene la entrada marcada en ${storeShort(store)}.</p></div>`;

    el().innerHTML = `
      <div style="margin-bottom:12px">
        <div style="font-size:24px;font-weight:800;letter-spacing:-.04em">Hola, ${esc((ME.name||'').split(' ')[0])}</div>
        <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${misEmps.length} colaboradores activos en ${storeShort(tiendaActiva())}</div>
      </div>

      ${tarjetaMensaje()}

      ${chipsTienda('vInicio()')}

      <div class="kpis">
        <div class="kpi"><div class="kpi-ico ico-g"><ion-icon name="flash-outline"></ion-icon></div>
          <div class="kpi-l">Trabajando</div><div class="kpi-v">${trabajando.length}</div></div>
        <div class="kpi"><div class="kpi-ico ico-p"><ion-icon name="time-outline"></ion-icon></div>
          <div class="kpi-l">Horas hoy</div><div class="kpi-v">${numES(horasHoy, 1)}</div></div>
        <div class="kpi" onclick="go('viajes')" style="cursor:pointer">
          <div class="kpi-ico ico-c"><ion-icon name="car-outline"></ion-icon></div>
          <div class="kpi-l">En ruta</div><div class="kpi-v">${enRuta.length}</div></div>
        <div class="kpi" onclick="go('permisos')" style="cursor:pointer">
          <div class="kpi-ico ico-a"><ion-icon name="calendar-outline"></ion-icon></div>
          <div class="kpi-l">Permisos</div><div class="kpi-v">${pendientes.length}</div></div>
      </div>

      <div class="section-t">Trabajando ahora</div>
      <div class="card">${filas}</div>

      ${pendientes.length ? `
      <div class="section-t">Permisos por resolver</div>
      <div class="card">
        ${pendientes.slice(0,3).map(t => `
          <div class="row row-link" onclick="go('permisos')">
            ${avatar(t.employeeName || '?', 34)}
            <div class="row-main">
              <div class="row-t">${esc(t.employeeName || '—')}</div>
              <div class="row-s">${fDateShort(t.startDate)} – ${fDateShort(t.endDate)}</div>
            </div>
            <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
          </div>`).join('')}
      </div>` : ''}

      ${tarjetaTareas()}
      ${tarjetaHorarios()}
      ${tarjetaReportes(store)}
      ${tarjetaFestejos(emps)}`;
  } catch (err) { errView(err); }
}

// ── Tareas de hoy ──
let tareasHoy = [], hechosHoy = {}, empsCache = [];

function tarjetaTareas() {
  if (!tareasHoy.length) return '';
  let total = 0, listos = 0;
  tareasHoy.forEach(t => {
    const h = (hechosHoy[t.id] && hechosHoy[t.id].hechos) || {};
    total += (t.items||[]).length;
    listos += (t.items||[]).filter((_,i) => h[i]).length;
  });
  const pct = total ? Math.round(listos/total*100) : 0;
  return `
    <div class="section-t">Tareas de hoy</div>
    <div class="card row-link" style="padding:14px 15px" onclick="verTareas()">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="kpi-ico ${pct===100?'ico-g':'ico-p'}" style="margin:0"><ion-icon name="checkbox-outline"></ion-icon></div>
        <div style="flex:1;min-width:0">
          <div class="row-t">${listos} de ${total} renglones listos</div>
          <div class="chk-barra" style="margin-top:6px;width:100%"><span style="width:${pct}%"></span></div>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
      </div>
    </div>`;
}

function verTareas() {
  openSheet(`
    <h3>Tareas de hoy · ${storeShort(tiendaActiva())}</h3>
    <div id="shTareas">${htmlTareas()}</div>`);
}

function htmlTareas() {
  return tareasHoy.map(t => {
    const h = (hechosHoy[t.id] && hechosHoy[t.id].hechos) || {};
    const items = t.items || [];
    const n = items.filter((_,i) => h[i]).length;
    return `<div class="chk-card ${n===items.length && items.length ? 'lista' : ''}">
      <div class="chk-head"><strong>${esc(t.titulo)}</strong><em>${n}/${items.length}</em></div>
      ${items.map((it, i) => {
        const q = h[i];
        return `<label class="chk-item ${q ? 'ok' : ''}">
          <input type="checkbox" ${q?'checked':''} onchange="toggleTarea('${t.id}',${i},this)">
          <span class="chk-caja"><ion-icon name="checkmark-outline"></ion-icon></span>
          <span class="chk-texto">${esc(it)}</span>
          ${q ? `<span class="chk-quien">${esc((q.nombre||'').split(' ')[0])}</span>` : ''}
        </label>`;
      }).join('')}
    </div>`;
  }).join('');
}

async function toggleTarea(tareaId, idx, chk) {
  chk.disabled = true;
  try {
    await marcarItem(tareaId, todayStr(), tiendaActiva(), idx, chk.checked);
    const doc = hechosHoy[tareaId] || (hechosHoy[tareaId] = { hechos:{} });
    if (chk.checked) doc.hechos[idx] = { nombre: ME.name, at: Date.now() };
    else delete doc.hechos[idx];
    const host = document.getElementById('shTareas');
    if (host) host.innerHTML = htmlTareas();
  } catch (err) {
    chk.checked = !chk.checked; chk.disabled = false;
    toast('No se pudo guardar: ' + err.message, 'err');
  }
}

// ── Reportes de incidentes ──
let reportes = [];

function tarjetaReportes(store) {
  const nuevos = reportes.filter(r => r.store === store && (r.status||'nuevo') === 'nuevo');
  return `
    <div class="section-t">Reportes</div>
    <div class="card row-link ${nuevos.length ? 'row-viva' : ''}" style="padding:14px 15px" onclick="verReportes()">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="kpi-ico ${nuevos.length ? 'ico-a' : 'ico-c'}" style="margin:0"><ion-icon name="warning-outline"></ion-icon></div>
        <div style="flex:1;min-width:0">
          <div class="row-t">${nuevos.length ? nuevos.length + (nuevos.length===1?' reporte nuevo':' reportes nuevos') : 'Sin reportes nuevos'}</div>
          <div class="row-s">Incidentes con foto del equipo</div>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
      </div>
    </div>`;
}

function verReportes() {
  const store = tiendaActiva();
  const lista = reportes.filter(r => r.store === store);
  openSheet(`
    <h3>Reportes · ${storeShort(store)}</h3>
    <button class="btn btn-primary btn-block" onclick="nuevoReporte()" style="margin:10px 0 14px">
      <ion-icon name="add-outline"></ion-icon> Nuevo reporte</button>
    <div id="shReps">
    ${lista.length ? lista.map(r => `
      <div class="card" style="padding:13px 14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${avatar(r.nombre||'?', 26)}
          <strong style="font-size:14px">${esc(r.nombre||'—')}</strong>
          ${(r.status||'nuevo')==='nuevo' ? '<span class="badge b-red">Nuevo</span>' : '<span class="badge b-green">Revisado</span>'}
          <span style="margin-left:auto;font-size:11.5px;color:var(--light)">${fDateShort(r.date)}</span>
        </div>
        <p style="margin:8px 0 0;font-size:13.5px;line-height:1.5;white-space:pre-wrap">${esc(r.texto||'')}</p>
        ${r.foto ? `<img src="${r.foto}" alt="Foto" loading="lazy" onclick="verFoto('${r.foto}')"
          style="margin-top:9px;width:100%;max-width:230px;border-radius:10px;border:1px solid var(--line);aspect-ratio:${(r.w||4)}/${(r.h||3)};object-fit:cover">` : ''}
        ${(r.status||'nuevo')==='nuevo' ? `
          <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="revisarRep('${r.id}',this)">
            <ion-icon name="checkmark-outline"></ion-icon> Marcar revisado</button>` : ''}
      </div>`).join('')
    : `<div class="empty"><ion-icon name="shield-checkmark-outline"></ion-icon><p>Sin reportes en esta tienda.</p></div>`}
    </div>`);
}

async function revisarRep(id, btn) {
  btn.disabled = true;
  try {
    await marcarReporteVisto(id);
    const r = reportes.find(x => x.id === id);
    if (r) { r.status = 'revisado'; r.revisadoPor = ME.name; }
    verReportes();
    toast('Reporte marcado como revisado', 'ok');
  } catch (err) { btn.disabled = false; toast('Error: ' + err.message, 'err'); }
}

function nuevoReporte() {
  openSheet(`
    <h3>Nuevo reporte · ${storeShort(tiendaActiva())}</h3>
    <p class="lead">Queda guardado y avisa al resto de la gerencia.</p>
    <div class="field"><label>¿Qué pasó?</label>
      <textarea id="repTxt" rows="4" placeholder="Describe el incidente..."></textarea></div>
    <div class="field"><label>Foto (opcional)</label>
      <input type="file" id="repFile" accept="image/*"></div>
    <button class="btn btn-primary btn-block" id="repBtn" onclick="enviarReporte()">
      <ion-icon name="send-outline"></ion-icon> Enviar reporte</button>`);
}

async function enviarReporte() {
  const texto = document.getElementById('repTxt').value.trim();
  if (!texto) { toast('Describe lo que pasó.', 'err'); return; }
  const file = document.getElementById('repFile').files[0] || null;
  const btn = document.getElementById('repBtn');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon> Enviando...';
  try {
    await crearReporte({ texto, store: tiendaActiva(), file }, pct => {
      if (pct !== null) btn.innerHTML = `Subiendo foto ${pct}%`;
    });
    closeSheet();
    toast('Reporte guardado', 'ok');
    vInicio();
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="send-outline"></ion-icon> Enviar reporte';
    toast('No se pudo enviar: ' + err.message, 'err');
  }
}

// ══════════ Grupo ══════════
let unsubChats = null, unsubMsgs = null, people = [], chatMeta = {}, activeChat = null;
let msgsCache = [];   // para repintar cuando cambian los "vistos"
let vistoFirma = '', listaFirma = '';   // para no repintar sin necesidad

function stopChatListeners() {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
}

function watchChats() {
  if (unsubChats) return;
  unsubChats = listenChats(list => {
    chatMeta = {};
    list.forEach(c => chatMeta[c.id] = c);
    if (activeChat) {
      marcarLeido(activeChat.id);
      marcarVisto(activeChat.id, msDe((chatMeta[activeChat.id]||{}).lastAt));
      // El "Visto" se actualiza en su sitio, sin repintar la conversación;
      // la marca propia se ignora (sólo importan los vistos de los demás).
      const firma = vistoFirmaDe(chatMeta[activeChat.id]);
      if (firma !== vistoFirma) { vistoFirma = firma; refrescarEstado(); }
    }
    pintarAvisos();
    // La lista sólo se rearma si cambió algo visible de ella
    const fl = list.map(c => [c.id, msDe(c.lastAt), c.lastMessage, c.lastSender, c.title].join('|')).join('§');
    if (TAB === 'grupo' && fl !== listaFirma) paintConvs();
    listaFirma = fl;
  });
}

let avisosAntes = 0;
function pintarAvisos() {
  const nuevos = sinLeer(Object.values(chatMeta));
  const tab = document.querySelector('.tab[data-t="grupo"]');
  if (tab) tab.classList.toggle('nuevo', nuevos.length > 0);
  if (nuevos.length > avisosAntes && TAB !== 'grupo') {
    const c = nuevos[0];
    const quien = String(c.id).startsWith('anuncios') ? (c.title || 'Anuncios')
      : ((c.names && c.names[c.lastSender]) || 'un colaborador');
    toast('Nuevo mensaje de ' + quien, 'info');
  }
  avisosAntes = nuevos.length;
}

async function vGrupo() {
  el().innerHTML = '<div class="skel-card"></div>'.repeat(4);
  try {
    if (!people.length) {
      const [emps, mgrs] = await Promise.all([
        getEmployees(), db.collection('Main').get()
      ]);
      people = [];
      mgrs.docs.forEach(d => { const m = d.data();
        people.push({ pid:'mgr:'+d.id, name:m.name||m.email||'Gerencia', sub:'Gerencia', kind:'m' }); });
      emps.forEach(e => {
        if (e.status === 'active') people.push({ pid:'emp:'+e.id, name:e.name, sub:storeShort(e.store), kind:'c', store:e.store }); });
      people = people.filter(p => p.pid !== ME.pid);
    }
    paintConvs();
    watchChats();
  } catch (err) { errView(err); }
}

function paintConvs() {
  const tiendaAct = tiendaActiva();
  const a = chatMeta[anunciosId(tiendaAct)] || {};
  const pend = {}; sinLeer(Object.values(chatMeta)).forEach(c => pend[c.id] = true);
  const punto = id => pend[id] ? '<span class="conv-dot"></span>' : '';
  const mgrs = people.filter(p=>p.kind==='m');
  const cols = people.filter(p=>p.kind==='c' && p.store === tiendaAct);
  const row = p => {
    const m = chatMeta[dmId(ME.pid,p.pid)] || {};
    return `<div class="conv" onclick="openDm('${p.pid}')">
      ${avatar(p.name,44)}
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">${esc(p.name)}${punto(dmId(ME.pid,p.pid))}</span>
          <span class="conv-t">${m.lastAt?relTime(m.lastAt):''}</span></div>
        <div class="conv-s">${esc(m.lastMessage || p.sub)}</div>
      </div></div>`;
  };
  const grupos = Object.values(chatMeta).filter(c => c.type === 'grupo')
    .filter(c => !c.store || c.store === tiendaAct)
    .sort((x,y) => String(x.title||'').localeCompare(String(y.title||'')));
  const filaGrupo = c => `
    <div class="conv" onclick="openGrupo('${c.id}')">
      <div class="conv-ava grupo"><ion-icon name="people-outline"></ion-icon></div>
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">${esc(c.title || 'Grupo')}${punto(c.id)}</span>
          <span class="conv-t">${c.lastAt?relTime(c.lastAt):''}</span></div>
        <div class="conv-s">${esc(c.lastMessage || ((c.participants||[]).length + ' miembros'))}</div>
      </div></div>`;

  el().innerHTML = `
    ${chipsTienda('paintConvs()')}
    <button class="btn btn-ghost btn-block" onclick="abrirGrupo()" style="margin-bottom:12px">
      <ion-icon name="people-outline"></ion-icon> Crear un grupo
    </button>
    <div class="conv" onclick="openAnuncios()">
      <div class="conv-ava anuncios"><ion-icon name="megaphone-outline"></ion-icon></div>
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">Anuncios de ${storeShort(tiendaAct)}${punto(anunciosId(tiendaAct))}</span>
          <span class="conv-t">${a.lastAt?relTime(a.lastAt):''}</span></div>
        <div class="conv-s">${esc(a.lastMessage || 'Publica novedades para todo el equipo')}</div>
      </div></div>
    <div class="conv-label">Tiendas</div>
    ${[tiendaAct].map(t => `
    <div class="conv" onclick="openTienda('${t}')">
      <div class="conv-ava tienda" style="background:${STORES[t].color}"><ion-icon name="storefront-outline"></ion-icon></div>
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">Chat de ${storeShort(t)}${punto('tienda_'+t)}</span>
          <span class="conv-t">${chatMeta['tienda_'+t]?.lastAt?relTime(chatMeta['tienda_'+t].lastAt):''}</span></div>
        <div class="conv-s">${esc(chatMeta['tienda_'+t]?.lastMessage || 'Toda la tienda, sin mezclar')}</div>
      </div></div>`).join('')}
    ${grupos.length?`<div class="conv-label">Grupos</div>${grupos.map(filaGrupo).join('')}`:''}
    ${cols.length?`<div class="conv-label">Colaboradores</div>${cols.map(row).join('')}`:''}
    ${mgrs.length?`<div class="conv-label">Gerencia</div>${mgrs.map(row).join('')}`:''}`;
}

async function openAnuncios() {
  const t = tiendaActiva();
  const ref = db.collection('Chats').doc(anunciosId(t));
  const doc = await ref.get();
  const titulo = 'Anuncios de ' + storeShort(t);
  if (!doc.exists) await ref.set({ type:'anuncios', store: t, title: titulo });
  else if (doc.data().title !== titulo) ref.update({ title: titulo }).catch(() => {});
  // La gerencia SÍ publica en anuncios
  activeChat = { id:anunciosId(t), type:'anuncios',
                 title:'Anuncios de ' + storeShort(t),
                 sub:'Toda la tienda · sólo publica la gerencia' };
  mountThread();
}

async function openDm(pid) {
  const p = people.find(x=>x.pid===pid);
  if (!p) return;
  try {
    const names = {}; names[ME.pid]=ME.name; names[p.pid]=p.name;
    const id = await ensureDm(p.pid, names);
    activeChat = { id, type:'dm', title:p.name, sub:p.sub+' · Conversación privada' };
    mountThread();
  } catch (err) {
    console.error('openDm', err);
    toast('No se pudo abrir la conversación: ' + err.message, 'err');
  }
}

async function openTienda(t) {
  await ensureTienda(t);
  activeChat = { id:'tienda_'+t, type:'tienda',
                 title:'Chat de ' + storeShort(t), sub:'Toda la tienda' };
  mountThread();
}

function openGrupo(id) {
  const c = chatMeta[id];
  if (!c) return;
  activeChat = { id, type:'grupo', title: c.title || 'Grupo',
                 sub: (c.participants||[]).length + ' miembros' };
  mountThread();
}

function mountThread() {
  marcarLeido(activeChat.id);
  marcarVisto(activeChat.id, msDe((chatMeta[activeChat.id]||{}).lastAt));
  pintarAvisos();
  document.getElementById('threadN').textContent = activeChat.title;
  document.getElementById('threadS').textContent = activeChat.sub;
  document.getElementById('threadAva').innerHTML = activeChat.type==='anuncios'
    ? '<div class="conv-ava anuncios" style="width:38px;height:38px;font-size:14px"><ion-icon name="megaphone-outline"></ion-icon></div>'
    : activeChat.type==='grupo'
    ? '<div class="conv-ava grupo" style="width:38px;height:38px;font-size:14px"><ion-icon name="people-outline"></ion-icon></div>'
    : activeChat.type==='tienda'
    ? '<div class="conv-ava tienda" style="width:38px;height:38px;font-size:14px"><ion-icon name="storefront-outline"></ion-icon></div>'
    : avatar(activeChat.title, 38);
  const editBtn = document.getElementById('grpEditBtn');
  if (editBtn) editBtn.style.display = activeChat.type==='grupo' ? '' : 'none';

  document.getElementById('composeWrap').innerHTML = `
    <div class="compose">
      <input type="file" id="fotoIn" accept="image/*" hidden onchange="doFoto(this)">
      <button class="adj" id="fotoBtn" aria-label="Enviar foto"
              onclick="document.getElementById('fotoIn').click()"><ion-icon name="image-outline"></ion-icon></button>
      <textarea id="msgIn" rows="1" placeholder="Escribe un mensaje..." oninput="autoCrecer(this)"></textarea>
      <button class="send" onclick="enviarMsg()"><ion-icon name="send-outline"></ion-icon></button>
    </div>`;

  document.getElementById('msgs').innerHTML =
    '<div class="empty"><ion-icon name="sync-outline" class="gira"></ion-icon></div>';
  document.getElementById('thread').classList.add('on');

  if (unsubMsgs) unsubMsgs();
  msgsCache = [];
  vistoFirma = '';
  unsubMsgs = listenMessages(activeChat.id, m => { msgsCache = m; paintMsgs(m); });
}

let chatPintado = null;   // la animación de entrada sólo la primera vez

function paintMsgs(list) {
  const box = document.getElementById('msgs');
  box.classList.toggle('sin-anim', chatPintado === activeChat.id);
  chatPintado = activeChat.id;
  if (!list.length) {
    box.innerHTML = `<div class="empty"><ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      <p>${activeChat.type==='anuncios'?'Publica el primer anuncio.':'Escribe el primer mensaje.'}</p></div>`;
    return;
  }
  const alFinal = box.scrollHeight - box.scrollTop - box.clientHeight < 90;

  let html = '', dia = '', prev = null;
  list.forEach((m, i) => {
    const d = m.createdAt?.toDate?.() || new Date();
    const k = toDateStr(d);
    let diaNuevo = false;
    if (k !== dia) { dia = k; diaNuevo = true;
      html += `<div class="day"><span>${k===todayStr()?'Hoy':fDate(k)}</span></div>`; }
    const seguido = !diaNuevo && prev && prev.senderId === m.senderId
      && (d - (prev.createdAt?.toDate?.() || d)) < 5*60*1000;
    const sig = list[i+1];
    const ultimo = !sig || sig.senderId !== m.senderId;
    prev = m;

    const mio = m.senderId === ME.pid;
    const esUltimoMio = mio && i === list.length - 1;
    if (activeChat.type === 'anuncios') {
      html += `<div class="anuncio">
        <div class="anuncio-h">${avatar(m.senderName,22)}<b>${esc(m.senderName)}</b>
          <time>${fTime(d)}</time></div>
        <div class="anuncio-b">${m.type === 'image'
          ? `<img class="anuncio-foto" src="${m.url}" alt="Foto" loading="lazy" onclick="verFoto('${m.url}')">`
          : esc(m.text).replace(/\n/g,'<br>')}</div>
        <div class="anuncio-rx">${rxPills(m)}${rxUi(m)}</div>
        ${esUltimoMio ? estadoDe(m) : ''}</div>`;
    } else {
      const burbuja = `<div class="bub ${m.type==='image'?'bub-foto':''}">
        ${m.type === 'image'
          ? `<img src="${m.url}" alt="Foto" loading="lazy"
                  style="aspect-ratio:${(m.w||4)}/${(m.h||3)}" onclick="verFoto('${m.url}')">`
          : `<div class="txt">${esc(m.text).replace(/\n/g,'<br>')}</div>`}
        <div class="at">${fTime(d)}</div></div>`;
      html += `<div class="bub-row ${mio?'me':''} ${seguido?'seguido':''} ${ultimo?'ultimo':''}">
        ${mio || seguido ? '' : `<div class="bub-quien">${esc(m.senderName||'')}</div>`}
        <div class="bub-linea">
          <div class="bub-col">${burbuja}${rxPills(m)}${esUltimoMio ? estadoDe(m) : ''}</div>
          ${rxUi(m)}
        </div></div>`;
    }
  });
  box.innerHTML = html;
  estadoFirma = '';
  if (alFinal) box.scrollTop = box.scrollHeight;
}

// Nombre que mostrar para un pid (para los "Visto" y las pastillas)
function nombreDePid(pid) {
  const p = people.find(x => x.pid === pid);
  if (p) return p.name;
  const meta = (activeChat && chatMeta[activeChat.id]) || {};
  return (meta.names && meta.names[pid]) || '·';
}

// ── Reacciones: barra 👍 ❤️ 👎 ──
function rxToggle(e, btn) {
  e.stopPropagation();
  const w = btn.parentElement;
  const abierto = w.classList.contains('rx-open');
  cerrarRx();
  if (!abierto) w.classList.add('rx-open');
}
function cerrarRx() {
  document.querySelectorAll('.rx-open').forEach(x => x.classList.remove('rx-open'));
}
document.addEventListener('click', cerrarRx);

function reacTap(e, msgId, tipo) {
  e.stopPropagation();
  cerrarRx();
  const m = msgsCache.find(x => x.id === msgId);
  const actual = m && m.reacciones ? m.reacciones[ME.pid] : null;
  reaccionar(msgId, tipo, actual)
    .catch(err => toast('No se pudo reaccionar: ' + err.message, 'err'));
}

function rxUi(m) {
  const rx = m.reacciones || {};
  return `<div class="rx-wrap">
    <button type="button" class="rx-tap" onclick="rxToggle(event,this)" aria-label="Reaccionar">
      <ion-icon name="happy-outline"></ion-icon></button>
    <div class="rx-bar">
      ${['up','love','down'].map(t =>
        `<button type="button" class="${rx[ME.pid]===t?'mia':''}"
                 onclick="reacTap(event,'${m.id}','${t}')">${REACCION[t]}</button>`).join('')}
    </div></div>`;
}

function rxPills(m) {
  const rx = m.reacciones || {};
  const conteo = { up:[], love:[], down:[] };
  Object.keys(rx).forEach(p => { if (conteo[rx[p]]) conteo[rx[p]].push(p); });
  const pills = ['up','love','down'].filter(t => conteo[t].length).map(t =>
    `<button type="button" class="rx-pill ${rx[ME.pid]===t?'mia':''}"
             onclick="reacTap(event,'${m.id}','${t}')">${REACCION[t]}<span>${conteo[t].length}</span></button>`).join('');
  return pills ? `<div class="rx-pills">${pills}</div>` : '';
}

// Estado bajo mi último mensaje: Enviando… → Enviado → Visto
function estadoDe(m) {
  const meta   = (activeChat && chatMeta[activeChat.id]) || {};
  const vistos = meta.vistos || {};
  const tMs = m.createdAt?.toMillis?.() || 0;
  if (!tMs) return `<div class="msg-estado"><ion-icon name="time-outline"></ion-icon> Enviando…</div>`;

  if (activeChat.type !== 'dm') {
    const quienes = Object.keys(vistos)
      .filter(p => p !== ME.pid && msDe(vistos[p]) >= tMs);
    return quienes.length
      ? `<div class="msg-estado visto">${quienes.slice(0,5).map(p => avatar(nombreDePid(p), 16)).join('')} Visto por ${quienes.length}</div>`
      : `<div class="msg-estado"><ion-icon name="checkmark-done-outline"></ion-icon> Enviado</div>`;
  }
  const otroPid = (meta.participants || []).find(p => p !== ME.pid) || '';
  return msDe(vistos[otroPid]) >= tMs
    ? `<div class="msg-estado visto">${avatar(nombreDePid(otroPid), 16)} Visto</div>`
    : `<div class="msg-estado"><ion-icon name="checkmark-done-outline"></ion-icon> Enviado</div>`;
}

function autoCrecer(t) {
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

async function enviarMsg() {
  const i = document.getElementById('msgIn');
  const t = i.value.trim();
  if (!t || !activeChat) return;
  i.value = ''; autoCrecer(i);
  try { await sendMessage(activeChat.id, t); }
  catch (err) { toast('No se pudo enviar: ' + err.message, 'err'); i.value = t; }
}

async function doFoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !activeChat) return;
  const btn = document.getElementById('fotoBtn');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon>';
  try {
    await enviarFoto(activeChat.id, file, pct => {
      if (pct === null) return;
      const p = btn.querySelector('.pct');
      if (p) p.textContent = pct + '%';
      else   btn.innerHTML = `<span class="pct">${pct}%</span>`;
    });
  } catch (err) {
    toast('No se pudo enviar la foto: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="image-outline"></ion-icon>';
  }
}

function verFoto(url) {
  let v = document.getElementById('visorFoto');
  if (!v) {
    v = document.createElement('div');
    v.id = 'visorFoto'; v.className = 'visor-foto';
    v.onclick = () => v.classList.remove('on');
    v.innerHTML = '<img alt="Foto">';
    document.body.appendChild(v);
  }
  v.querySelector('img').src = url;
  v.classList.add('on');
}

function closeThread() {
  document.getElementById('thread').classList.remove('on');
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  activeChat = null;
}

    const completos = regs.filter(r => r.status === 'completado');
    const enRuta    = regs.filter(r => r.status === 'en-ruta');
    const kmTotal   = completos.reduce((s,r) => s + (Number(r.km)||0), 0);

    const fila = r => {

      </div>`;
    };

    el().innerHTML = `
      ${chipsTienda('vViajes()')}
      <div class="chips-rango">
        ${['hoy','semana','mes'].map(x => `
          <button class="chip-r ${viajesRango===x?'on':''}"
            onclick="viajesRango='${x}';vViajes()">${{hoy:'Hoy',semana:'Semana',mes:'Mes'}[x]}</button>`).join('')}

// Las horas del documento llegan aquí como objeto plano tras el JSON
function fTime2(ts) {
  if (!ts) return '—';
  if (ts.seconds != null) return fTime(new Date(ts.seconds * 1000));
  return fTime(ts);
}

async function cerrarViajeSheet(id, kmSalida) {
  const km = parseFloat(document.getElementById('cvKm').value);
  const hora = document.getElementById('cvHora').value;
  if (isNaN(km) || km < kmSalida) {
    toast(`Escribe un kilometraje mayor que la salida (${numES(kmSalida,1)} km).`, 'err'); return;
  }
  if (!hora) { toast('Escribe la hora de llegada.', 'err'); return; }
  try {
    const doc = await db.collection('Registros').doc(id).get();
    const fecha = doc.exists ? doc.data().date : todayStr();
    const llegada = firebase.firestore.Timestamp.fromDate(new Date(`${fecha}T${hora}:00`));
    const r = await cerrarViaje(id, km, llegada);
    closeSheet();
    toast(`Viaje cerrado · ${numES(r.km, 1)} km`, 'ok');
    vViajes();
  } catch (err) { toast('No se pudo cerrar: ' + err.message, 'err'); }
}

async function guardarGrupo(id) {
  const nombre = document.getElementById('grpNombre').value.trim();
  if (!nombre) { toast('Ponle nombre al grupo.', 'err'); return; }
  const elegidos = [...document.querySelectorAll('#grpMiembros input:checked')].map(i => i.value);
  if (!elegidos.length) { toast('Elige al menos un miembro.', 'err'); return; }

  const participants = [...new Set([ME.pid, ...elegidos])];
  const names = {}; names[ME.pid] = ME.name;
  people.forEach(p => { if (participants.includes(p.pid)) names[p.pid] = p.name; });

  const btn = document.getElementById('grpBtn');
  btn.disabled = true;
  try {
    const docId = id || 'grp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await db.collection('Chats').doc(docId).set({
      type:'grupo', title: nombre, participants, names,
      store: (id && (chatMeta[id]||{}).store) || tiendaActiva(),
      createdBy: ME.pid
    }, { merge:true });
    closeSheet();
    toast(`Grupo "${nombre}" · ${participants.length} miembros`, 'ok');
    if (activeChat && activeChat.id === docId) {
      activeChat.title = nombre;
      document.getElementById('threadN').textContent = nombre;
      document.getElementById('threadS').textContent = participants.length + ' miembros';
    }
  } catch (err) { toast('No se pudo guardar: ' + err.message, 'err'); }
  finally { btn.disabled = false; }
}

async function borrarGrupo(id) {
  if (!confirm('¿Eliminar este grupo para todos?')) return;
  try {
    await db.collection('Chats').doc(id).delete();
    closeSheet();
    if (activeChat && activeChat.id === id) closeThread();
    toast('Grupo eliminado', 'info');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function verHorarioDe(empId, lunes) {
  const emp = empsCache.find(e => e.id === empId);
  if (!emp) return;
  horEmpSem = lunes || lunesDe(new Date());
  const dias = diasDeSemana(horEmpSem);
  const shifts = await horarioDe(horEmpSem, emp.store).catch(() => ({}));
  const mios = shifts[empId] || {};
  const hoy = todayStr();
  const esActual = horEmpSem === lunesDe(new Date());
  const a = parseD(dias[0]), b = parseD(dias[6]);
  const horasDe = t => {
    if (!t) return 0;
    const [h1,m1]=t.in.split(':').map(Number), [h2,m2]=t.out.split(':').map(Number);
    return Math.max(0,(h2*60+m2-h1*60-m1)/60);
  };
  const total = dias.reduce((s,f) => s + horasDe(mios[f]), 0);

  openSheet(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <button class="btn btn-ghost btn-sm" onclick="verHorariosEquipo()" aria-label="Volver">
        <ion-icon name="chevron-back-outline"></ion-icon></button>
      ${avatar(emp.name, 34)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:700">${esc(emp.name)}</div>
        <div style="font-size:12px;color:var(--muted)">${numES(total, 1)} h · ${a.getDate()} ${MCORTO[a.getMonth()]} – ${b.getDate()} ${MCORTO[b.getMonth()]}${esActual ? ' · actual' : ''}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="moverHorarioDe('${empId}',-1)" aria-label="Anterior">
        <ion-icon name="chevron-back-outline"></ion-icon></button>
      <button class="btn btn-ghost btn-sm" onclick="moverHorarioDe('${empId}',1)" aria-label="Siguiente">
        <ion-icon name="chevron-forward-outline"></ion-icon></button>
    </div>
    <div class="card">
      ${dias.map((f, i) => {
        const t = mios[f];
        const d = parseD(f);
        return `<div class="hor-dia ${f === hoy ? 'hoy' : ''}">
          <div class="hor-fecha"><div class="hor-nom">${DCORTO[(i + 1) % 7]}</div>
            <div class="hor-num">${d.getDate()}</div></div>
          <div class="hor-info">
            ${t ? `<div class="hor-turno">${t.in} – ${t.out}</div>
                   <div class="hor-sub">${numES(horasDe(t), 1)} h</div>`
                : `<span class="hor-libre">Libre</span>`}
          </div>
          ${f === hoy ? '<span class="badge b-green">Hoy</span>' : ''}
        </div>`;
      }).join('')}
    </div>`);
}

function moverHorarioDe(empId, n) {
  const d = parseD(horEmpSem || lunesDe(new Date()));
  d.setDate(d.getDate() + n * 7);
  verHorarioDe(empId, toDateStr(d));
}
