<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%234f46e5'/%3E%3Cg transform='translate(2.8 8.03) scale(0.726)'%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z'/%3E%3C/g%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>El Águila — Gerencia</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>
<body>

<!-- ══════════ Acceso ══════════ -->
<div class="login" id="login">
  <div class="login-inner">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="7 0 44 44"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg>
      </div>
      <div class="login-name">El Águila</div>
      <div class="login-sub">Gerencia</div>
    </div>

    <div class="login-card">
      <h2>Inicia sesión</h2>
      <p>Con tu cuenta de gerencia de siempre.</p>

      <div class="alert err" id="loginAlert" style="display:none"><ion-icon name="alert-circle-outline"></ion-icon><span id="loginAlertMsg"></span></div>

      <form onsubmit="doLogin(event)">
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="mail" placeholder="tu@correo.com" required autocomplete="email" inputmode="email">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="pass" placeholder="Tu contraseña" required autocomplete="current-password">
            <button type="button" class="pw-eye" onclick="togglePw()"><ion-icon name="eye-outline" id="pwIco"></ion-icon></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top:6px">
          <ion-icon name="log-in-outline"></ion-icon> Entrar
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ══════════ App ══════════ -->
<div class="app" id="app">
  <header class="appbar">
    <div style="flex:1">
      <h1 id="barTitle">Panel</h1>
      <span class="sub" id="barSub"></span>
    </div>
    <div id="barAva" onclick="showPerfil()" style="cursor:pointer"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- Conversación a pantalla completa -->
<div class="thread" id="thread">
  <div class="thread-bar">
    <button class="back" onclick="closeThread()"><ion-icon name="chevron-back-outline"></ion-icon></button>
    <div id="threadAva"></div>
    <div style="flex:1;min-width:0">
      <div class="thread-n" id="threadN"></div>
      <div class="thread-s" id="threadS"></div>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div id="composeWrap"></div>
</div>

<!-- Hoja inferior -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="app.js"></script>
<script>
// ══════════ Acceso ══════════
function togglePw() {
  const i = document.getElementById('pass'), c = document.getElementById('pwIco');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  c.setAttribute('name', show ? 'eye-off-outline' : 'eye-outline');
}
function loginErr(msg) {
  document.getElementById('loginAlertMsg').textContent = msg;
  document.getElementById('loginAlert').style.display = '';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon> Entrando...';
  document.getElementById('loginAlert').style.display = 'none';
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('mail').value.trim(),
      document.getElementById('pass').value);
  } catch (err) {
    loginErr(err.code === 'auth/invalid-login-credentials' || err.code === 'auth/wrong-password'
      ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar: ' + err.message);
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="log-in-outline"></ion-icon> Entrar';
  }
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    document.getElementById('app').classList.remove('on');
    document.getElementById('login').style.display = '';
    return;
  }
  try {
    await loadSession(user);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('on');
    document.getElementById('barAva').innerHTML = avatar(ME.name, 36);
    buildTabs();
    watchChats();
    setupPush();
    go('inicio');
  } catch (err) {
    await auth.signOut();
    loginErr(err.message);
    const btn = document.getElementById('loginBtn');
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="log-in-outline"></ion-icon> Entrar';
  }
});

function showPerfil() {
  openSheet(`
    <h3>${esc(ME.name)}</h3>
    <p class="lead">${esc(ME.email || '')} · Gerencia</p>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><div class="row-main"><div class="row-t">Escritorio</div>
        <div class="row-s">Nómina, horario y reportes viven en el software completo.</div></div></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="auth.signOut();closeSheet()">
      <ion-icon name="log-out-outline"></ion-icon> Cerrar sesión
    </button>`);
}

// ══════════ Navegación ══════════
const TABS = [
  { id:'inicio',   ico:'speedometer-outline', lbl:'Panel'    },
  { id:'grupo',    ico:'chatbubbles-outline', lbl:'Grupo'    },
  { id:'viajes',   ico:'car-outline',         lbl:'Viajes'   },
  { id:'pedidos',  ico:'clipboard-outline',   lbl:'Pedidos'  },
  { id:'permisos', ico:'calendar-outline',    lbl:'Permisos' }
];
let TAB = 'inicio';

function buildTabs() {
  document.getElementById('tabbar').innerHTML = TABS.map(t =>
    `<button class="tab ${t.id===TAB?'on':''}" data-t="${t.id}" onclick="go('${t.id}')">
       <ion-icon name="${t.ico}"></ion-icon><span>${t.lbl}</span></button>`).join('');
}

const TITLES = { inicio:'Panel', grupo:'Grupo', viajes:'Viajes', pedidos:'Pedidos', permisos:'Permisos' };

function go(tab) {
  TAB = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  document.getElementById('barTitle').textContent = TITLES[tab] || '';
  document.getElementById('barSub').textContent = tab === 'inicio'
    ? fDateLong(new Date()) : storeName(tiendaActiva());
  stopChatListeners();
  ({ inicio:vInicio, grupo:vGrupo, viajes:vViajes, pedidos:vPedidos,
     permisos:vPermisos }[tab] || vInicio)();
}

const el = () => document.getElementById('view');
const loading = (n=3) => el().innerHTML = '<div class="skel-card"></div>'.repeat(n);

function errView(err) {
  console.error(err);
  el().innerHTML = `<div class="card"><div class="empty">
    <ion-icon name="alert-circle-outline"></ion-icon><p>${esc(err.message)}</p></div></div>`;
}

// Fichas de tienda: el mismo par en todas las vistas que filtran
function chipsTienda(onchange) {
  const cur = tiendaActiva();
  return `<div class="chips-tienda">
    ${STORE_IDS.map(id => `
      <button class="chip-t ${cur===id?'on':''}" style="--sc:${STORES[id].color}"
        onclick="setTienda('${id}');${onchange}">${storeShort(id)}</button>`).join('')}
  </div>`;
}

// ══════════ Panel ══════════
async function vInicio() {
  loading(3);
  try {
    const store = tiendaActiva();
    const hoy = todayStr();
    const [emps, jobs, abiertos, deHoy, tos, regs] = await Promise.all([
      getEmployees(), getJobs(), getOpenClockIns(), getClockInsHoy(),
      getTimeOff(), getRegistros({ store, desde: hoy, hasta: hoy })
    ]);

    const misEmps    = emps.filter(e => e.store === store && e.status === 'active');
    const trabajando = abiertos.filter(c => c.store === store);
    const horasHoy   = deHoy.filter(c => c.store === store && c.clockOut)
                            .reduce((s,c) => s + (c.hours||0), 0);
    const pendientes = tos.filter(t => t.status === 'pending');
    const enRuta     = regs.filter(r => r.status === 'en-ruta');

    const filas = trabajando.length ? trabajando.map(c => {
      const emp = emps.find(e => e.id === c.employeeId);
      if (!emp) return '';
      const job = jobs.find(j => j.id === emp.jobId);
      const ci  = c.clockIn && c.clockIn.toDate ? c.clockIn.toDate() : new Date();
      const olvido = c.date && c.date < hoy;
      return `<div class="row">
        ${avatar(emp.name, 38)}
        <div class="row-main">
          <div class="row-t">${esc(emp.name)}</div>
          <div class="row-s">${esc(job ? job.title : '—')} · desde las ${fTime(ci)}</div>
        </div>
        ${olvido
          ? `<span class="badge b-amber">Sin cerrar ${fDateShort(c.date)}</span>`
          : `<span class="badge b-green">${numES((Date.now()-ci.getTime())/3600000, 1)} h</span>`}
      </div>`;
    }).join('') : `<div class="empty"><ion-icon name="time-outline"></ion-icon>
      <p>Nadie tiene la entrada marcada en ${storeShort(store)}.</p></div>`;

    el().innerHTML = `
      <div style="margin-bottom:12px">
        <div style="font-size:24px;font-weight:800;letter-spacing:-.04em">Hola, ${esc((ME.name||'').split(' ')[0])}</div>
        <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${misEmps.length} colaboradores activos en ${storeShort(tiendaActiva())}</div>
      </div>

      ${chipsTienda('vInicio()')}

      <div class="kpis">
        <div class="kpi"><div class="kpi-ico ico-g"><ion-icon name="flash-outline"></ion-icon></div>
          <div class="kpi-l">Trabajando</div><div class="kpi-v">${trabajando.length}</div></div>
        <div class="kpi"><div class="kpi-ico ico-p"><ion-icon name="time-outline"></ion-icon></div>
          <div class="kpi-l">Horas hoy</div><div class="kpi-v">${numES(horasHoy, 1)}</div></div>
        <div class="kpi" onclick="go('viajes')" style="cursor:pointer">
          <div class="kpi-ico ico-c"><ion-icon name="car-outline"></ion-icon></div>
          <div class="kpi-l">En ruta</div><div class="kpi-v">${enRuta.length}</div></div>
        <div class="kpi" onclick="go('permisos')" style="cursor:pointer">
          <div class="kpi-ico ico-a"><ion-icon name="calendar-outline"></ion-icon></div>
          <div class="kpi-l">Permisos</div><div class="kpi-v">${pendientes.length}</div></div>
      </div>

      <div class="section-t">Trabajando ahora</div>
      <div class="card">${filas}</div>

      ${pendientes.length ? `
      <div class="section-t">Permisos por resolver</div>
      <div class="card">
        ${pendientes.slice(0,3).map(t => `
          <div class="row row-link" onclick="go('permisos')">
            ${avatar(t.employeeName || '?', 34)}
            <div class="row-main">
              <div class="row-t">${esc(t.employeeName || '—')}</div>
              <div class="row-s">${fDateShort(t.startDate)} – ${fDateShort(t.endDate)}</div>
            </div>
            <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
          </div>`).join('')}
      </div>` : ''}`;
  } catch (err) { errView(err); }
}

// ══════════ Grupo ══════════
let unsubChats = null, unsubMsgs = null, people = [], chatMeta = {}, activeChat = null;

function stopChatListeners() {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
}

function watchChats() {
  if (unsubChats) return;
  unsubChats = listenChats(list => {
    chatMeta = {};
    list.forEach(c => chatMeta[c.id] = c);
    if (activeChat) marcarLeido(activeChat.id);
    pintarAvisos();
    if (TAB === 'grupo') paintConvs();
  });
}

let avisosAntes = 0;
function pintarAvisos() {
  const nuevos = sinLeer(Object.values(chatMeta));
  const tab = document.querySelector('.tab[data-t="grupo"]');
  if (tab) tab.classList.toggle('nuevo', nuevos.length > 0);
  if (nuevos.length > avisosAntes && TAB !== 'grupo') {
    const c = nuevos[0];
    const quien = c.id === ANUNCIOS ? 'Anuncios Generales'
      : ((c.names && c.names[c.lastSender]) || 'un colaborador');
    toast('Nuevo mensaje de ' + quien, 'info');
  }
  avisosAntes = nuevos.length;
}

async function vGrupo() {
  el().innerHTML = '<div class="skel-card"></div>'.repeat(4);
  try {
    if (!people.length) {
      const [emps, mgrs] = await Promise.all([
        getEmployees(), db.collection('Main').get()
      ]);
      people = [];
      mgrs.docs.forEach(d => { const m = d.data();
        people.push({ pid:'mgr:'+d.id, name:m.name||m.email||'Gerencia', sub:'Gerencia', kind:'m' }); });
      emps.forEach(e => {
        if (e.status === 'active') people.push({ pid:'emp:'+e.id, name:e.name, sub:storeShort(e.store), kind:'c' }); });
      people = people.filter(p => p.pid !== ME.pid);
    }
    paintConvs();
    watchChats();
  } catch (err) { errView(err); }
}

function paintConvs() {
  const a = chatMeta[ANUNCIOS] || {};
  const pend = {}; sinLeer(Object.values(chatMeta)).forEach(c => pend[c.id] = true);
  const punto = id => pend[id] ? '<span class="conv-dot"></span>' : '';
  const mgrs = people.filter(p=>p.kind==='m'), cols = people.filter(p=>p.kind==='c');
  const row = p => {
    const m = chatMeta[dmId(ME.pid,p.pid)] || {};
    return `<div class="conv" onclick="openDm('${p.pid}')">
      ${avatar(p.name,44)}
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">${esc(p.name)}${punto(dmId(ME.pid,p.pid))}</span>
          <span class="conv-t">${m.lastAt?relTime(m.lastAt):''}</span></div>
        <div class="conv-s">${esc(m.lastMessage || p.sub)}</div>
      </div></div>`;
  };
  el().innerHTML = `
    <div class="conv" onclick="openAnuncios()">
      <div class="conv-ava anuncios"><ion-icon name="megaphone-outline"></ion-icon></div>
      <div class="conv-main">
        <div class="conv-top"><span class="conv-n">Anuncios Generales${punto(ANUNCIOS)}</span>
          <span class="conv-t">${a.lastAt?relTime(a.lastAt):''}</span></div>
        <div class="conv-s">${esc(a.lastMessage || 'Publica novedades para todo el equipo')}</div>
      </div></div>
    ${cols.length?`<div class="conv-label">Colaboradores</div>${cols.map(row).join('')}`:''}
    ${mgrs.length?`<div class="conv-label">Gerencia</div>${mgrs.map(row).join('')}`:''}`;
}

async function openAnuncios() {
  await db.collection('Chats').doc(ANUNCIOS)
    .set({ type:'anuncios', participants:[], names:{} }, { merge:true });
  // La gerencia SÍ publica en anuncios
  activeChat = { id:ANUNCIOS, type:'anuncios', title:'Anuncios Generales',
                 sub:'Todo el equipo · sólo publica la gerencia' };
  mountThread();
}

async function openDm(pid) {
  const p = people.find(x=>x.pid===pid);
  if (!p) return;
  const names = {}; names[ME.pid]=ME.name; names[p.pid]=p.name;
  const id = await ensureDm(p.pid, names);
  activeChat = { id, type:'dm', title:p.name, sub:p.sub+' · Conversación privada' };
  mountThread();
}

function mountThread() {
  marcarLeido(activeChat.id);
  pintarAvisos();
  document.getElementById('threadN').textContent = activeChat.title;
  document.getElementById('threadS').textContent = activeChat.sub;
  document.getElementById('threadAva').innerHTML = activeChat.type==='anuncios'
    ? '<div class="conv-ava anuncios" style="width:38px;height:38px;font-size:14px"><ion-icon name="megaphone-outline"></ion-icon></div>'
    : avatar(activeChat.title, 38);

  document.getElementById('composeWrap').innerHTML = `
    <div class="compose">
      <input type="file" id="fotoIn" accept="image/*" hidden onchange="doFoto(this)">
      <button class="adj" id="fotoBtn" aria-label="Enviar foto"
              onclick="document.getElementById('fotoIn').click()"><ion-icon name="image-outline"></ion-icon></button>
      <textarea id="msgIn" rows="1" placeholder="Escribe un mensaje..." oninput="autoCrecer(this)"></textarea>
      <button class="send" onclick="enviarMsg()"><ion-icon name="send-outline"></ion-icon></button>
    </div>`;

  document.getElementById('msgs').innerHTML =
    '<div class="empty"><ion-icon name="sync-outline" class="gira"></ion-icon></div>';
  document.getElementById('thread').classList.add('on');

  if (unsubMsgs) unsubMsgs();
  unsubMsgs = listenMessages(activeChat.id, paintMsgs);
}

function paintMsgs(list) {
  const box = document.getElementById('msgs');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      <p>${activeChat.type==='anuncios'?'Publica el primer anuncio.':'Escribe el primer mensaje.'}</p></div>`;
    return;
  }
  const alFinal = box.scrollHeight - box.scrollTop - box.clientHeight < 90;

  let html = '', dia = '', prev = null;
  list.forEach((m, i) => {
    const d = m.createdAt?.toDate?.() || new Date();
    const k = toDateStr(d);
    let diaNuevo = false;
    if (k !== dia) { dia = k; diaNuevo = true;
      html += `<div class="day"><span>${k===todayStr()?'Hoy':fDate(k)}</span></div>`; }
    const seguido = !diaNuevo && prev && prev.senderId === m.senderId
      && (d - (prev.createdAt?.toDate?.() || d)) < 5*60*1000;
    const sig = list[i+1];
    const ultimo = !sig || sig.senderId !== m.senderId;
    prev = m;

    if (activeChat.type === 'anuncios') {
      html += `<div class="anuncio">
        <div class="anuncio-h">${avatar(m.senderName,22)}<b>${esc(m.senderName)}</b>
          <time>${fTime(d)}</time></div>
        <div class="anuncio-b">${m.type === 'image'
          ? `<img class="anuncio-foto" src="${m.url}" alt="Foto" loading="lazy" onclick="verFoto('${m.url}')">`
          : esc(m.text).replace(/\n/g,'<br>')}</div></div>`;
    } else {
      const mio = m.senderId === ME.pid;
      html += `<div class="bub-row ${mio?'me':''} ${seguido?'seguido':''} ${ultimo?'ultimo':''}">
        ${mio || seguido ? '' : `<div class="bub-quien">${esc(m.senderName||'')}</div>`}
        <div class="bub ${m.type==='image'?'bub-foto':''}">
        ${m.type === 'image'
          ? `<img src="${m.url}" alt="Foto" loading="lazy"
                  style="aspect-ratio:${(m.w||4)}/${(m.h||3)}" onclick="verFoto('${m.url}')">`
          : `<div class="txt">${esc(m.text).replace(/\n/g,'<br>')}</div>`}
        <div class="at">${fTime(d)}</div></div></div>`;
    }
  });
  box.innerHTML = html;
  if (alFinal) box.scrollTop = box.scrollHeight;
}

function autoCrecer(t) {
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

async function enviarMsg() {
  const i = document.getElementById('msgIn');
  const t = i.value.trim();
  if (!t || !activeChat) return;
  i.value = ''; autoCrecer(i);
  try { await sendMessage(activeChat.id, t); }
  catch (err) { toast('No se pudo enviar: ' + err.message, 'err'); i.value = t; }
}

async function doFoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !activeChat) return;
  const btn = document.getElementById('fotoBtn');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon>';
  try {
    await enviarFoto(activeChat.id, file, pct => {
      if (pct === null) return;
      const p = btn.querySelector('.pct');
      if (p) p.textContent = pct + '%';
      else   btn.innerHTML = `<span class="pct">${pct}%</span>`;
    });
  } catch (err) {
    toast('No se pudo enviar la foto: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<ion-icon name="image-outline"></ion-icon>';
  }
}

function verFoto(url) {
  let v = document.getElementById('visorFoto');
  if (!v) {
    v = document.createElement('div');
    v.id = 'visorFoto'; v.className = 'visor-foto';
    v.onclick = () => v.classList.remove('on');
    v.innerHTML = '<img alt="Foto">';
    document.body.appendChild(v);
  }
  v.querySelector('img').src = url;
  v.classList.add('on');
}

function closeThread() {
  document.getElementById('thread').classList.remove('on');
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  activeChat = null;
}

// ══════════ Viajes ══════════
let viajesRango = 'hoy';

async function vViajes() {
  loading(3);
  try {
    const n = new Date();
    let desde = todayStr();
    if (viajesRango === 'semana') desde = lunesDe(n);
    if (viajesRango === 'mes')    desde = toDateStr(new Date(n.getFullYear(), n.getMonth(), 1));
    const regs = await getRegistros({ store: tiendaActiva(), desde, hasta: todayStr() });

    const completos = regs.filter(r => r.status === 'completado');
    const enRuta    = regs.filter(r => r.status === 'en-ruta');
    const kmTotal   = completos.reduce((s,r) => s + (Number(r.km)||0), 0);

    const fila = r => {
      const abierto = r.status === 'en-ruta';
      return `<div class="row ${abierto?'row-viva':''}" onclick='verViaje(${JSON.stringify(JSON.stringify(r))})'>
        ${avatar(r.employeeName || '?', 38)}
        <div class="row-main">
          <div class="row-t">${esc(r.employeeName || '—')} · ${esc(r.vehiculo || '—')}</div>
          <div class="row-s">${fDateShort(r.date)} · ${fTime(r.horaSalida)}${abierto ? '' : ' – ' + fTime(r.horaLlegada)}</div>
        </div>
        <div style="text-align:right">
          <div class="row-v">${abierto ? '…' : numES(r.km, 1) + ' km'}</div>
          <span class="badge ${abierto?'b-green':'b-blue'}" style="margin-top:4px">${abierto?'En ruta':durLabel(r.minutos)}</span>
        </div>
      </div>`;
    };

    el().innerHTML = `
      ${chipsTienda('vViajes()')}
      <div class="chips-rango">
        ${['hoy','semana','mes'].map(x => `
          <button class="chip-r ${viajesRango===x?'on':''}"
            onclick="viajesRango='${x}';vViajes()">${{hoy:'Hoy',semana:'Semana',mes:'Mes'}[x]}</button>`).join('')}
      </div>
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi"><div class="kpi-l">Viajes</div><div class="kpi-v">${regs.length}</div></div>
        <div class="kpi"><div class="kpi-l">Km</div><div class="kpi-v" style="font-size:19px">${numES(kmTotal, 1)}</div></div>
        <div class="kpi"><div class="kpi-l">En ruta</div><div class="kpi-v">${enRuta.length}</div></div>
      </div>
      <div class="section-t">Viajes</div>
      ${regs.length
        ? `<div class="card">${regs.map(fila).join('')}</div>`
        : `<div class="card"><div class="empty"><ion-icon name="car-outline"></ion-icon>
             <p>No hay viajes en este rango.</p></div></div>`}`;
  } catch (err) { errView(err); }
}

function verViaje(json) {
  const r = JSON.parse(json);
  const abierto = r.status === 'en-ruta';
  openSheet(`
    <h3>${esc(r.employeeName || '—')}</h3>
    <p class="lead">${esc(r.vehiculo || '—')} · ${fDate(r.date)}</p>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><div class="row-main"><div class="row-t">Salida</div></div>
        <div class="row-v">${fTime2(r.horaSalida)} · ${numES(r.kmSalida, 1)} km</div></div>
      <div class="row"><div class="row-main"><div class="row-t">Llegada</div></div>
        <div class="row-v">${abierto ? 'En ruta' : `${fTime2(r.horaLlegada)} · ${numES(r.kmLlegada, 1)} km`}</div></div>
      ${abierto ? '' : `
      <div class="row" style="background:var(--primary-soft)">
        <div class="row-main"><div class="row-t">Recorrido</div></div>
        <div class="row-v" style="color:var(--primary)">${numES(r.km, 1)} km · ${durLabel(r.minutos)}</div></div>`}
    </div>
    ${abierto ? `
    <div class="lbl">Cerrar el viaje (si olvidó registrar la llegada)</div>
    <input type="number" id="cvKm" inputmode="decimal" step="0.1" placeholder="Kilometraje de llegada">
    <input type="time" id="cvHora" style="margin-top:8px">
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick='cerrarViajeSheet("${r.id}", ${r.kmSalida})'>
      <ion-icon name="flag-outline"></ion-icon> Cerrar viaje
    </button>` : ''}
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeSheet()">Cerrar</button>`);
}

// Las horas del documento llegan aquí como objeto plano tras el JSON
function fTime2(ts) {
  if (!ts) return '—';
  if (ts.seconds != null) return fTime(new Date(ts.seconds * 1000));
  return fTime(ts);
}

async function cerrarViajeSheet(id, kmSalida) {
  const km = parseFloat(document.getElementById('cvKm').value);
  const hora = document.getElementById('cvHora').value;
  if (isNaN(km) || km < kmSalida) {
    toast(`Escribe un kilometraje mayor que la salida (${numES(kmSalida,1)} km).`, 'err'); return;
  }
  if (!hora) { toast('Escribe la hora de llegada.', 'err'); return; }
  try {
    const doc = await db.collection('Registros').doc(id).get();
    const fecha = doc.exists ? doc.data().date : todayStr();
    const llegada = firebase.firestore.Timestamp.fromDate(new Date(`${fecha}T${hora}:00`));
    const r = await cerrarViaje(id, km, llegada);
    closeSheet();
    toast(`Viaje cerrado · ${numES(r.km, 1)} km`, 'ok');
    vViajes();
  } catch (err) { toast('No se pudo cerrar: ' + err.message, 'err'); }
}

// ══════════ Pedidos ══════════
const PED_EST = {
  borrador: { label:'Borrador', badge:'b-amber' },
  enviado:  { label:'Enviado',  badge:'b-blue'  },
  recibido: { label:'Recibido', badge:'b-green' }
};

async function vPedidos() {
  loading(3);
  try {
    const peds = await getPedidos(tiendaActiva());
    const fila = p => {
      const est = PED_EST[p.status||'borrador'] || PED_EST.borrador;
      return `<div class="row row-link" onclick='verPedido(${JSON.stringify(JSON.stringify(p))})'>
        <div class="row-main">
          <div class="row-t">${esc(p.title || 'Pedido')}</div>
          <div class="row-s">${fDateShort(p.date)} · ${esc(p.createdByName || '—')} · ${(p.items||[]).length} artículos</div>
        </div>
        <span class="badge ${est.badge}">${est.label}</span>
      </div>`;
    };
    el().innerHTML = `
      ${chipsTienda('vPedidos()')}
      ${peds.length
        ? `<div class="card">${peds.map(fila).join('')}</div>`
        : `<div class="card"><div class="empty"><ion-icon name="clipboard-outline"></ion-icon>
             <p>No hay pedidos en ${storeShort(tiendaActiva())}.</p></div></div>`}`;
  } catch (err) { errView(err); }
}

function verPedido(json) {
  const p = JSON.parse(json);
  const items = p.items || [];
  const est = p.status || 'borrador';
  openSheet(`
    <h3>${esc(p.title || 'Pedido')}</h3>
    <p class="lead">${fDate(p.date)} · ${esc(p.createdByName || '—')}</p>
    <div class="card" style="margin-bottom:12px;max-height:40vh;overflow-y:auto">
      ${items.length ? items.map((it,i) => `
        <div class="row">
          <div class="row-main"><div class="row-t">${i+1}. ${esc(it.name)}</div>
            ${it.note ? `<div class="row-s">${esc(it.note)}</div>` : ''}</div>
          <div class="row-v">${esc(it.qty || '')} ${esc(it.unit || '')}</div>
        </div>`).join('')
      : '<div class="empty"><p>Sin artículos.</p></div>'}
    </div>
    ${p.note ? `<p class="lead" style="margin-bottom:12px"><strong>Nota:</strong> ${esc(p.note)}</p>` : ''}
    <div class="lbl">Estado</div>
    <div class="est-btns">
      ${Object.keys(PED_EST).map(k => `
        <button class="est-btn ${est===k?'on':''}" onclick='cambiarEstado("${p.id}","${k}")'>${PED_EST[k].label}</button>`).join('')}
    </div>
    <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="closeSheet()">Cerrar</button>`);
}

async function cambiarEstado(id, status) {
  try {
    await updatePedido(id, { status });
    closeSheet();
    toast('Pedido marcado como ' + PED_EST[status].label.toLowerCase(), 'ok');
    vPedidos();
  } catch (err) { toast('No se pudo cambiar: ' + err.message, 'err'); }
}

// ══════════ Permisos ══════════
const TO_TIPO   = { vacation:'Vacaciones', sick:'Enfermedad', personal:'Personal' };
const TO_ESTADO = { approved:{l:'Aprobado',b:'b-green'}, pending:{l:'Pendiente',b:'b-amber'}, denied:{l:'Denegado',b:'b-red'} };

async function vPermisos() {
  loading(2);
  try {
    const tos = await getTimeOff();
    const pend = tos.filter(t => t.status === 'pending');
    const resto = tos.filter(t => t.status !== 'pending').slice(0, 15);

    const filaPend = t => `
      <div class="card" style="margin-bottom:10px;padding:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          ${avatar(t.employeeName || '?', 38)}
          <div style="flex:1;min-width:0">
            <div class="row-t">${esc(t.employeeName || '—')}</div>
            <div class="row-s">${TO_TIPO[t.type] || t.type || 'Permiso'} · ${fDateShort(t.startDate)} – ${fDate(t.endDate)}</div>
          </div>
        </div>
        ${t.reason ? `<p class="lead" style="margin-bottom:10px">"${esc(t.reason)}"</p>` : ''}
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" onclick='aprobar(${JSON.stringify(JSON.stringify(t))})'>
            <ion-icon name="checkmark-outline"></ion-icon> Aprobar</button>
          <button class="btn btn-ghost" style="flex:1" onclick='abrirDenegar(${JSON.stringify(JSON.stringify(t))})'>
            <ion-icon name="close-outline"></ion-icon> Denegar</button>
        </div>
      </div>`;

    const filaResto = t => {
      const e = TO_ESTADO[t.status] || TO_ESTADO.pending;
      return `<div class="row">
        <div class="row-main">
          <div class="row-t">${esc(t.employeeName || '—')}</div>
          <div class="row-s">${fDateShort(t.startDate)} – ${fDateShort(t.endDate)}${t.denyReason ? ' · ' + esc(t.denyReason) : ''}</div>
        </div>
        <span class="badge ${e.b}">${e.l}</span>
      </div>`;
    };

    el().innerHTML = `
      ${pend.length
        ? `<div class="section-t">Por resolver</div>${pend.map(filaPend).join('')}`
        : `<div class="card" style="margin-bottom:14px"><div class="empty">
             <ion-icon name="checkmark-circle-outline"></ion-icon><p>No hay solicitudes pendientes.</p></div></div>`}
      ${resto.length ? `<div class="section-t">Resueltos</div><div class="card">${resto.map(filaResto).join('')}</div>` : ''}`;
  } catch (err) { errView(err); }
}

async function aprobar(json) {
  const t = JSON.parse(json);
  try {
    await updateTimeOff(t.id, {
      status: 'approved',
      denyReason: firebase.firestore.FieldValue.delete(),
      decidedBy: ME.name, decidedAt: new Date().toISOString()
    });
    toast('Permiso aprobado', 'ok');
    // La persona sale sola del horario de esos días
    try {
      const n = await quitarDelHorario(t.employeeId, t.startDate, t.endDate);
      if (n) toast(`${n} ${n===1?'turno quitado':'turnos quitados'} del horario`, 'info');
    } catch (e) {
      console.error(e);
      toast('Revisa el horario: no se pudieron quitar sus turnos.', 'err');
    }
    vPermisos();
  } catch (err) { toast('No se pudo aprobar: ' + err.message, 'err'); }
}

function abrirDenegar(json) {
  const t = JSON.parse(json);
  openSheet(`
    <h3>Denegar permiso</h3>
    <p class="lead">${esc(t.employeeName || '—')} · ${fDateShort(t.startDate)} – ${fDate(t.endDate)}</p>
    <div class="lbl">Motivo (el colaborador lo verá) *</div>
    <textarea id="denyMotivo" rows="3" placeholder="Ej: esa semana estamos cortos de personal"></textarea>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick='denegar("${t.id}")'>Denegar con este motivo</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}

async function denegar(id) {
  const motivo = (document.getElementById('denyMotivo').value || '').trim();
  if (!motivo) { toast('Escribe el motivo: el colaborador lo verá.', 'err'); return; }
  try {
    await updateTimeOff(id, {
      status: 'denied', denyReason: motivo,
      decidedBy: ME.name, decidedAt: new Date().toISOString()
    });
    closeSheet();
    toast('Solicitud denegada · el colaborador verá el motivo', 'info');
    vPermisos();
  } catch (err) { toast('No se pudo denegar: ' + err.message, 'err'); }
}
</script>
